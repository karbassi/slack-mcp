[project]
name = "slack-mcp"
version = "2.1.0"
description = "MCP server exposing Slack Web API methods as tools"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.2",
    "slack-sdk",
    "aiohttp",
    "httpx",
    "python-dotenv",
    "py-key-value-aio[disk]",
    "platformdirs>=4.5.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[tool.pytest.ini_options]
markers = ["integration: real Slack API tests"]
asyncio_mode = "auto"

[project.scripts]
slack-mcp = "slack_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_mcp"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PLR",  # pylint refactor (complexity, nesting, branches)
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return (unnecessary else after return)
    "PIE",  # flake8-pie (unnecessary passes, duplicate fields)
    "FURB", # refurb (non-idiomatic patterns)
    "PERF", # perflint (performance anti-patterns)
    "ARG",  # flake8-unused-arguments
    "RUF",  # ruff-specific opinionated rules
    "TRY",  # tryceratops (exception handling anti-patterns)
    "PT",   # flake8-pytest-style
]
ignore = [
    "B008",    # Depends() in function defaults is the FastMCP pattern
    "PLR0913", # too many arguments — Slack API wrappers have many optional params
]

[tool.ruff.lint.per-file-ignores]
"src/slack_mcp/server.py" = ["E402", "F401"]  # side-effect imports after load_dotenv()
"tests/**" = ["F401", "PLR2004"]  # F401: skip-decorated test stubs; PLR2004: magic values in assertions are clearer
