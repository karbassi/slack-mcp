# Run `uv run pre-commit install` once to enable these hooks locally.
# Versions are sourced from uv.lock so they stay in sync with `mise run lint`/`typecheck`.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ty
        name: ty
        entry: uv run ty check src/
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
